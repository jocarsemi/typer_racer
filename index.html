<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Type Racer — Carreras de mecanografía</title>
<style>
  /* ---------- Estilos generales ---------- */
  :root {
    --bg: #0f1220;
    --panel: #1a1f36;
    --panel2: #232a4a;
    --text: #e6e9f5;
    --muted: #8890b5;
    --accent: #4f8cff;
    --ok: #2ecc71;
    --err: #ff4d5e;
    --border: #2c3358;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 20% -10%, #1b2350 0%, var(--bg) 60%) fixed;
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: .5px; }
  h2 { font-size: 18px; margin: 0 0 12px; color: var(--muted); font-weight: 500; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    padding: 10px 16px; font-weight: 600; cursor: pointer; font-size: 15px;
    transition: filter .15s;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .45; cursor: not-allowed; filter: none; }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button.danger { background: var(--err); }
  input, textarea {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel2); color: var(--text);
    font-size: 15px; font-family: inherit;
  }
  textarea { min-height: 120px; resize: vertical; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 6px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .center { text-align: center; }
  .code-big {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 40px; letter-spacing: 8px; font-weight: 800;
    color: #fff; background: var(--panel2); border: 1px solid var(--border);
    padding: 10px 20px; border-radius: 12px; display: inline-block;
  }

  /* ---------- Selector de color ---------- */
  .colors { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .color-swatch {
    width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
    border: 3px solid transparent; transition: transform .1s, border-color .1s;
  }
  .color-swatch:hover { transform: scale(1.08); }
  .color-swatch.selected { border-color: #fff; }
  .color-swatch.taken { opacity: .2; cursor: not-allowed; }

  /* ---------- Lista jugadores ---------- */
  .player-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-bottom: 1px solid var(--border);
  }
  .player-row:last-child { border-bottom: 0; }
  .dot { width: 16px; height: 16px; border-radius: 50%; flex: 0 0 16px; }

  /* ---------- Pista de carreras ---------- */
  #track {
    position: relative;
    background: linear-gradient(180deg, #1b2038 0%, #10142a 100%);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 12px 12px 12px;
    overflow: hidden;
  }
  .lane {
    position: relative;
    height: 46px;
    border-radius: 8px;
    background:
      repeating-linear-gradient(90deg, transparent 0 30px, rgba(255,255,255,.05) 30px 60px),
      rgba(255,255,255,.02);
    margin-bottom: 6px;
    overflow: hidden;
  }
  .lane:last-child { margin-bottom: 0; }
  .lane .finish-line {
    position: absolute; right: 6px; top: 0; bottom: 0; width: 6px;
    background: repeating-linear-gradient(0deg, #fff 0 6px, #000 6px 12px);
    opacity: .7;
    border-radius: 2px;
  }
  .car {
    position: absolute;
    top: 50%;
    left: 0;
    transform: translateY(-50%);
    width: 54px; height: 30px;
    transition: left .15s linear;
    will-change: left;
  }
  .car .name-tag {
    position: absolute; top: -18px; left: 0;
    font-size: 11px; color: var(--muted); white-space: nowrap;
  }

  /* ---------- Texto a escribir ---------- */
  #type-area {
    position: relative;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 20px;
    line-height: 1.7;
    letter-spacing: .5px;
    word-break: break-word;
    white-space: pre-wrap;
    user-select: none;
  }
  #type-area .ok { color: var(--ok); }
  #type-area .pending { color: #8a90b5; }
  #type-area .current {
    background: rgba(79,140,255,.25);
    border-bottom: 2px solid var(--accent);
    border-radius: 3px;
  }
  #type-area .current.err {
    background: rgba(255,77,94,.3);
    border-bottom-color: var(--err);
    animation: shake .18s;
  }
  @keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    50% { transform: translateX(3px); }
    75% { transform: translateX(-2px); }
    100% { transform: translateX(0); }
  }

  /* ---------- Cuenta atrás ---------- */
  #countdown {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(8,10,22,.8); z-index: 50; font-size: 140px; font-weight: 900;
    color: #fff; text-shadow: 0 0 40px rgba(79,140,255,.8);
  }

  /* ---------- Banner ganador ---------- */
  #winner-banner {
    text-align: center; padding: 18px; border-radius: 12px; margin-bottom: 16px;
    background: linear-gradient(90deg, #2ecc71, #27ae60); color: #06210f; font-weight: 800;
    font-size: 22px;
  }

  /* ---------- Podio ---------- */
  .podium { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
  .podium .slot {
    flex: 1; max-width: 200px; text-align: center; padding: 16px; border-radius: 12px;
    background: var(--panel2); border: 1px solid var(--border);
  }
  .podium .slot .medal { font-size: 30px; }
  .podium .slot.gold { border-color: #f1c40f; }
  .podium .slot.silver { border-color: #bdc3c7; }
  .podium .slot.bronze { border-color: #cd7f32; }

  /* ---------- Confetti simple ---------- */
  .confetti {
    position: fixed; top: -10px; width: 8px; height: 14px; z-index: 60;
    animation: fall linear forwards;
    pointer-events: none;
  }
  @keyframes fall {
    to { transform: translateY(105vh) rotate(720deg); opacity: .9; }
  }

  /* ---------- Ranking ---------- */
  .rank-item {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 0; border-bottom: 1px solid var(--border);
  }
  .rank-item:last-child { border-bottom: 0; }
  .rank-item .pos { width: 24px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { flex: 1; height: 8px; background: #0d1026; border-radius: 5px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); transition: width .2s linear; }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #2b335c; color: #fff; padding: 10px 16px; border-radius: 10px;
    border: 1px solid var(--border); z-index: 100; opacity: 0; transition: opacity .2s;
    max-width: 90vw;
  }
  #toast.show { opacity: 1; }
  #toast.err { background: #6d1e28; border-color: #a03340; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ================= HOME ================= -->
  <section id="view-home">
    <div class="card">
      <h1>🏁 Type Racer</h1>
      <h2>Carreras de mecanografía multijugador</h2>
      <div class="row" style="margin-top:12px">
        <button id="btn-go-profesor">Soy profesor</button>
        <button id="btn-go-jugador" class="ghost">Soy alumno</button>
      </div>
    </div>
  </section>

  <!-- ================= PROFESOR ================= -->
  <section id="view-profesor" class="hidden">
    <div class="card">
      <div class="row" style="justify-content: space-between">
        <div>
          <h1>Panel del profesor</h1>
          <h2>Crea la sala y pega el texto</h2>
        </div>
        <button class="ghost" data-nav="home">← Volver</button>
      </div>

      <div id="prof-create">
        <label>Texto de la carrera</label>
        <textarea id="prof-text" placeholder="Pega aquí el texto que deberán escribir los alumnos…"></textarea>
        <div class="row" style="margin-top:12px">
          <button id="btn-create-room">Crear sala</button>
          <span id="prof-error" class="muted"></span>
        </div>
      </div>

      <div id="prof-lobby" class="hidden">
        <label>Sala (comparte este código)</label>
        <div class="center"><span class="code-big" id="room-code">-----</span></div>

        <div class="row" style="margin-top:16px; justify-content: space-between">
          <strong>Jugadores: <span id="count-players">0</span></strong>
          <div class="row">
            <button id="btn-start" disabled>Iniciar carrera</button>
            <button id="btn-restart" class="ghost hidden">Reiniciar</button>
          </div>
        </div>

        <div id="players-list" style="margin-top:10px"></div>

        <div id="rank-live" class="hidden">
          <h2 style="margin-top:16px">Clasificación en vivo</h2>
          <div id="rank-list"></div>
        </div>
      </div>
    </div>

    <!-- Pista del profesor -->
    <div class="card hidden" id="prof-track-card">
      <h2>Circuito</h2>
      <div id="prof-track"></div>
    </div>
  </section>

  <!-- ================= JUGADOR ================= -->
  <section id="view-jugador" class="hidden">
    <div class="card">
      <div class="row" style="justify-content: space-between">
        <div>
          <h1>Sala de espera</h1>
          <h2>Esperando al profesor…</h2>
        </div>
        <button class="ghost" data-nav="home">← Salir</button>
      </div>

      <!-- Formulario de unión -->
      <div id="join-form">
        <label>Código de sala</label>
        <input id="join-code" placeholder="ABCDE" maxlength="6" style="text-transform:uppercase" />
        <label>Tu nombre</label>
        <input id="join-name" placeholder="Tu nombre" maxlength="15" />
        <label>Color del coche</label>
        <div class="colors" id="color-picker"></div>
        <div class="row" style="margin-top:14px">
          <button id="btn-join">Entrar a la carrera</button>
          <span id="join-error" class="muted"></span>
        </div>
      </div>

      <!-- Espera -->
      <div id="wait-room" class="hidden">
        <p class="muted">Estás dentro. Esperando a que el profesor inicie la carrera…</p>
        <div id="wait-players"></div>
      </div>
    </div>

    <!-- Pista del jugador -->
    <div class="card hidden" id="play-track-card">
      <h2>Circuito</h2>
      <div id="play-track"></div>
    </div>

    <!-- Zona de escritura -->
    <div class="card hidden" id="play-type-card">
      <h2>Escribe el texto</h2>
      <div id="type-area"></div>
      <input id="hidden-input" class="hidden" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false" />
    </div>

    <!-- Resultados -->
    <div class="card hidden" id="play-results">
      <div id="winner-banner" class="hidden"></div>
      <h2>Podio</h2>
      <div class="podium" id="podium"></div>
      <div class="row" style="margin-top:16px; justify-content:center">
        <button class="ghost" data-nav="home">Volver al inicio</button>
      </div>
    </div>
  </section>

</div>

<!-- Overlays -->
<div id="countdown" class="hidden">3</div>
<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
/* =========================================================
   CLIENTE — toda la lógica de UI + Socket.IO
   ========================================================= */

const COLORS = ['#e74c3c','#3498db','#2ecc71','#f1c40f','#e67e22','#9b59b6','#fd79a8','#00cec9'];
const socket = io();

/* ---------- Utilidades UI ---------- */
const $ = (id) => document.getElementById(id);
function show(el) { el.classList.remove('hidden'); }
function hide(el) { el.classList.add('hidden'); }

let toastTimer = null;
function toast(msg, isErr = false) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 2600);
}

function switchView(name) {
  ['home','profesor','jugador'].forEach(v => {
    $('view-' + v).classList.toggle('hidden', v !== name);
  });
}

/* ---------- Navegación por hash ---------- */
function applyHash() {
  const h = location.hash.replace('#','');
  if (h === 'profesor') { switchView('profesor'); resetProfesor(); }
  else if (h === 'jugador') { switchView('jugador'); resetJugador(); }
  else switchView('home');
}
window.addEventListener('hashchange', applyHash);

$('btn-go-profesor').onclick = () => { location.hash = 'profesor'; };
$('btn-go-jugador').onclick  = () => { location.hash = 'jugador'; };
document.querySelectorAll('[data-nav="home"]').forEach(b => {
  b.onclick = () => { location.hash = ''; };
});

/* =========================================================
   ESTADO LOCAL
   ========================================================= */
const state = {
  // profesor
  isHost: false,
  roomId: null,
  // jugador
  me: { id: null, name: '', color: COLORS[0] },
  joined: false,
  // común
  text: '',
  textLen: 0,
  racing: false,
  players: [],
  // jugador: progreso local
  cursor: 0,
  errorFlash: false
};

/* =========================================================
   PROFESOR
   ========================================================= */
function resetProfesor() {
  if (state.isHost && state.roomId) return; // conserva si ya hay sala
  state.roomId = null;
  state.isHost = false;
  hide($('prof-lobby'));
  hide($('prof-track-card'));
  show($('prof-create'));
  $('btn-create-room').disabled = false;
  $('room-code').textContent = '-----';
  $('players-list').innerHTML = '';
  $('rank-live').classList.add('hidden');
}

$('btn-create-room').onclick = () => {
  const text = $('prof-text').value;
  if (!text.trim()) { $('prof-error').textContent = 'El texto no puede estar vacío.'; return; }
  $('prof-error').textContent = 'Creando…';
  socket.emit('create_room', { text }, (res) => {
    if (!res.ok) { $('prof-error').textContent = res.error; return; }
    state.isHost = true;
    state.roomId = res.roomId;
    state.text = text;
    state.textLen = text.length;
    $('room-code').textContent = res.roomId;
    hide($('prof-create'));
    show($('prof-lobby'));
  });
};

$('btn-start').onclick = () => socket.emit('start_race');
$('btn-restart').onclick = () => socket.emit('restart_race');

/* =========================================================
   JUGADOR
   ========================================================= */
function resetJugador() {
  state.me = { id: null, name: '', color: COLORS[0] };
  state.joined = false;
  state.cursor = 0;
  state.racing = false;
  hide($('play-track-card'));
  hide($('play-type-card'));
  hide($('play-results'));
  hide($('wait-room'));
  show($('join-form'));
  $('join-code').value = '';
  $('join-name').value = '';
  $('join-error').textContent = '';
  buildColorPicker();
}

function buildColorPicker(taken = []) {
  const box = $('color-picker');
  box.innerHTML = '';
  COLORS.forEach(c => {
    const el = document.createElement('div');
    el.className = 'color-swatch' + (c === state.me.color ? ' selected' : '') + (taken.includes(c) ? ' taken' : '');
    el.style.background = c;
    el.title = c;
    el.onclick = () => {
      if (taken.includes(c)) return;
      state.me.color = c;
      buildColorPicker(taken);
    };
    box.appendChild(el);
  });
}

$('btn-join').onclick = () => {
  const code = $('join-code').value.trim().toUpperCase();
  const name = $('join-name').value.trim();
  if (!code) { $('join-error').textContent = 'Introduce el código.'; return; }
  if (!name) { $('join-error').textContent = 'Introduce tu nombre.'; return; }

  $('join-error').textContent = 'Entrando…';
  socket.emit('join_room', { roomId: code, name, color: state.me.color }, (res) => {
    if (!res.ok) { $('join-error').textContent = res.error; return; }
    state.me.id = socket.id;
    state.me.name = name;
    state.joined = true;
    state.roomId = res.roomId;
    $('join-error').textContent = '';
    hide($('join-form'));
    show($('wait-room'));
  });
};

/* =========================================================
   SOCKET — eventos entrantes
   ========================================================= */
socket.on('room_update', (room) => {
  state.players = room.players;
  state.textLen = room.textLength;

  // Vista profesor
  if (state.isHost) {
    $('count-players').textContent = room.players.length;
    $('btn-start').disabled = !(room.state === 'lobby' && room.players.length > 0);
    $('btn-start').classList.toggle('hidden', room.state !== 'lobby');
    $('btn-restart').classList.toggle('hidden', room.state === 'lobby');

    // Lista con botón expulsar
    const list = $('players-list');
    list.innerHTML = '';
    room.players.forEach(p => {
      const row = document.createElement('div');
      row.className = 'player-row';
      row.innerHTML = `<span class="dot" style="background:${p.color}"></span>
                       <span style="flex:1">${escapeHtml(p.name)}</span>`;
      const btn = document.createElement('button');
      btn.className = 'danger';
      btn.textContent = 'Expulsar';
      btn.onclick = () => socket.emit('kick', { playerId: p.id });
      row.appendChild(btn);
      list.appendChild(row);
    });

    // Ranking en vivo
    if (room.state === 'racing' || room.state === 'finished') {
      show($('rank-live'));
      renderRanking($('rank-list'), room.players);
    } else {
      hide($('rank-live'));
    }

    // Pista del profesor
    if (room.state !== 'lobby') {
      show($('prof-track-card'));
      renderTrack($('prof-track'), room.players, room.textLength);
    } else {
      hide($('prof-track-card'));
    }
  }

  // Vista jugador
  if (state.joined) {
    // Lista en espera
    if (room.state === 'lobby') {
      const wp = $('wait-players');
      wp.innerHTML = '<h2 style="margin-top:16px">Jugadores en la sala</h2>' +
        room.players.map(p => `<div class="player-row"><span class="dot" style="background:${p.color}"></span>
          <span>${escapeHtml(p.name)}${p.id === state.me.id ? ' (tú)' : ''}</span></div>`).join('');
    }

    // Pista
    if (room.state === 'racing' || room.state === 'finished') {
      show($('play-track-card'));
      renderTrack($('play-track'), room.players, room.textLength, state.me.id);
    }

    // Resultados
    if (room.state === 'finished') {
      show($('play-results'));
      renderPodium(room.players);
    }
  }
});

socket.on('race_started', ({ text }) => {
  state.text = text;
  state.textLen = text.length;
  state.cursor = 0;
  state.racing = true;
  state.errorFlash = false;

  if (state.joined) {
    hide($('wait-room'));
    show($('play-type-card'));
    renderTypeArea();
    focusHiddenInput();
  }
});

socket.on('race_update', ({ players }) => {
  // El servidor manda progreso oficial; el jugador local ya avanza con su cursor,
  // pero si otro coche necesita actualizarse, lo hacemos vía renderTrack.
  state.players = players;
  if (state.isHost) {
    if (state.roomId) {
      show($('prof-track-card'));
      renderTrack($('prof-track'), players, state.textLen);
      if (!$('rank-live').classList.contains('hidden')) {
        renderRanking($('rank-list'), players);
      }
    }
  }
  if (state.joined) {
    show($('play-track-card'));
    renderTrack($('play-track'), players, state.textLen, state.me.id);
  }
});

socket.on('countdown', ({ n }) => {
  const el = $('countdown');
  if (n > 0) {
    el.textContent = n;
    el.classList.remove('hidden');
  } else {
    el.textContent = 'GO';
    setTimeout(() => el.classList.add('hidden'), 500);
  }
});

socket.on('winner', ({ name }) => {
  if (state.joined) {
    toast(`🏆 ¡${name} ha ganado!`);
    launchConfetti();
  }
});

socket.on('room_closed', ({ message }) => {
  toast(message, true);
  state.joined = false;
  state.isHost = false;
  state.roomId = null;
  location.hash = '';
  resetJugador();
  resetProfesor();
});

socket.on('kicked', () => {
  toast('Has sido expulsado de la sala.', true);
  state.joined = false;
  state.roomId = null;
  location.hash = '';
  resetJugador();
});

socket.on('error', (msg) => toast(msg, true));

/* =========================================================
   RENDER: pista
   ========================================================= */
function renderTrack(container, players, textLength, myId) {
  // Reutiliza carriles existentes por id
  container.innerHTML = '';
  const track = document.createElement('div');
  track.id = 'track';

  players.forEach(p => {
    const lane = document.createElement('div');
    lane.className = 'lane';
    const finish = document.createElement('div');
    finish.className = 'finish-line';
    lane.appendChild(finish);

    const pct = textLength > 0 ? Math.min(1, p.chars / textLength) : 0;

    const car = document.createElement('div');
    car.className = 'car';
    // margen para que el coche no se salga del carril
    const usable = 100;
    car.style.left = `calc(${pct * usable}% - ${pct * 54}px)`;

    car.innerHTML = `
      <div class="name-tag">${escapeHtml(p.name)}${p.id === myId ? ' (tú)' : ''}</div>
      ${carSvg(p.color)}
    `;
    lane.appendChild(car);
    track.appendChild(lane);
  });

  container.appendChild(track);
}

function carSvg(color) {
  return `
  <svg width="54" height="30" viewBox="0 0 54 30" xmlns="http://www.w3.org/2000/svg">
    <rect x="2" y="10" width="50" height="12" rx="6" fill="${color}" stroke="#000" stroke-opacity=".35"/>
    <rect x="10" y="4" width="26" height="10" rx="4" fill="${color}" stroke="#000" stroke-opacity=".35"/>
    <circle cx="14" cy="24" r="4.5" fill="#111"/>
    <circle cx="42" cy="24" r="4.5" fill="#111"/>
    <circle cx="14" cy="24" r="2" fill="#666"/>
    <circle cx="42" cy="24" r="2" fill="#666"/>
  </svg>`;
}

/* =========================================================
   RENDER: ranking
   ========================================================= */
function renderRanking(container, players) {
  const sorted = [...players].sort((a, b) => b.chars - a.chars);
  container.innerHTML = '';
  sorted.forEach((p, i) => {
    const pct = state.textLen ? Math.round((p.chars / state.textLen) * 100) : 0;
    const row = document.createElement('div');
    row.className = 'rank-item';
    row.innerHTML = `
      <span class="pos">${i + 1}º</span>
      <span class="dot" style="background:${p.color}"></span>
      <span style="width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${escapeHtml(p.name)}</span>
      <span class="bar"><span style="width:${pct}%; background:${p.color}"></span></span>
      <span class="muted" style="width:44px; text-align:right">${pct}%</span>
    `;
    container.appendChild(row);
  });
}

/* =========================================================
   RENDER: podio + confetti
   ========================================================= */
function renderPodium(players) {
  const finished = [...players].filter(p => p.finished)
                               .sort((a, b) => (a.finishAt || 0) - (b.finishAt || 0));
  const others = [...players].filter(p => !p.finished)
                             .sort((a, b) => b.chars - a.chars);
  const ordered = [...finished, ...others].slice(0, 3);
  const medals = ['🥇','🥈','🥉'];
  const classes = ['gold','silver','bronze'];
  $('podium').innerHTML = ordered.map((p, i) => `
    <div class="slot ${classes[i]}">
      <div class="medal">${medals[i]}</div>
      <div style="font-weight:700; margin-top:6px">${escapeHtml(p.name)}</div>
      <div class="muted">${state.textLen ? Math.round((p.chars / state.textLen) * 100) : 0}%</div>
    </div>
  `).join('');

  const winner = finished[0];
  if (winner) {
    const banner = $('winner-banner');
    banner.textContent = `🏆 ¡${winner.name} ha ganado la carrera!`;
    show(banner);
  }
}

function launchConfetti() {
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
    c.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
    c.style.animationDelay = (Math.random() * 0.4) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3800);
  }
}

/* =========================================================
   MECÁNICA DE TECLADO (jugador)
   ========================================================= */
function focusHiddenInput() {
  const inp = $('hidden-input');
  inp.value = '';
  inp.focus();
}
document.addEventListener('click', () => {
  if (state.racing && state.joined) focusHiddenInput();
});

// Bloqueos anti-trampas
const hiddenInput = $('hidden-input');
['paste','cut','drop'].forEach(ev => hiddenInput.addEventListener(ev, e => e.preventDefault()));
hiddenInput.addEventListener('contextmenu', e => e.preventDefault());

// Manejador principal de teclas
hiddenInput.addEventListener('keydown', (e) => {
  if (!state.racing || !state.joined) return;

  // Ignorar modificadores y teclas muertas
  if (e.key === 'Dead' || e.key === 'Process') { e.preventDefault(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Shift' || e.key === 'CapsLock' || e.key === 'Tab' ||
      e.key === 'Backspace' || e.key === 'Enter' || e.key.length !== 1) {
    if (e.key === 'Backspace') e.preventDefault();
    return;
  }

  const expected = state.text[state.cursor];
  if (expected === undefined) return;

  if (e.key === expected) {
    // Acierto
    state.cursor++;
    state.errorFlash = false;
    renderTypeArea();
    sendProgress(true);

    if (state.cursor >= state.text.length) {
      // Fin local
      state.racing = false;
      focusHiddenInput();
    }
  } else {
    // Fallo: no avanza, feedback visual
    state.errorFlash = true;
    renderTypeArea();
    // Re-render para reiniciar la animación
    setTimeout(() => { state.errorFlash = true; }, 10);
  }

  e.preventDefault();
});

// Throttling de progreso
let lastSent = 0;
let pendingSend = null;
function sendProgress(immediate = false) {
  const now = Date.now();
  const doSend = () => {
    socket.emit('progress', { chars: state.cursor });
    lastSent = Date.now();
  };
  if (immediate || now - lastSent > 120) {
    doSend();
  } else if (!pendingSend) {
    pendingSend = setTimeout(() => {
      pendingSend = null;
      doSend();
    }, 120 - (now - lastSent));
  }
}

/* =========================================================
   RENDER: zona de texto
   ========================================================= */
function renderTypeArea() {
  const el = $('type-area');
  const text = state.text;
  const cur = state.cursor;
  const okPart = text.slice(0, cur);
  const curChar = text[cur] || '';
  const rest = text.slice(cur + 1);

  el.innerHTML = '';
  if (okPart) {
    const s = document.createElement('span');
    s.className = 'ok';
    s.textContent = okPart;
    el.appendChild(s);
  }
  if (curChar) {
    const s = document.createElement('span');
    s.className = 'current' + (state.errorFlash ? ' err' : '');
    s.textContent = curChar === ' ' ? '\u00A0' : curChar;
    el.appendChild(s);
    // Forzar reflow para reiniciar animación
    void s.offsetWidth;
  }
  if (rest) {
    const s = document.createElement('span');
    s.className = 'pending';
    s.textContent = rest;
    el.appendChild(s);
  }
}

/* =========================================================
   UTIL
   ========================================================= */
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* =========================================================
   ARRANQUE
   ========================================================= */
buildColorPicker();
applyHash();
</script>
